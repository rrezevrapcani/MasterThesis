model:
  name: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract
  max_length: 512  

data:
  train_path: datasets/biored/processed/train_for_my_pipeline.csv
  dev_path: datasets/biored/processed/dev_for_my_pipeline.csv
  test_path: datasets/biored/processed/test_for_my_pipeline.csv
  text_column: marked_text
  label_column: relation_type
  no_relation_label: "No_Relation"
  balance_negative_samples: false
  max_neg_scale: 1.0

training:
  learning_rate: 1e-5              
  batch_size: 16                   
  eval_batch_size: 32              
  epochs: 10                        
  weight_decay: 0.01
  seed: 42
  fp16: true
  eval_strategy: steps             
  eval_steps: 100                  
  save_steps: 100                  

output:
  dir: results/pubmedbert_hierarchical_biored