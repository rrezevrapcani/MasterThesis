model:
  name: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract
  max_length: 512

data:
  train_path: data/processed/two_stage/stage1_binary/train.csv
  dev_path: data/processed/two_stage/stage1_binary/dev.csv
  test_path: data/processed/two_stage/stage1_binary/test.csv
  text_column: passage_text
  label_column: relation_type

training:
  learning_rate: 1e-5
  batch_size: 16
  epochs: 10
  weight_decay: 0.01
  seed: 42
  fp16: true

output:
  dir: results/stage1_binary_classification
