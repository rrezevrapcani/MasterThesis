input_file: datasets/biored/processed/train_for_my_pipeline.csv
output_dir: outputs/generation/synthetic_twins_qwen4b_easysteer_pilot

text_column: marked_text
label_column: relation_type
doc_id_column: doc_id
entity1_text_column: entity1_text
entity2_text_column: entity2_text
entity1_id_column: entity1_id
entity2_id_column: entity2_id
entity1_type_column: entity1_type
entity2_type_column: entity2_type
entity_pair_type_column: entity_pair_type

model_name: Qwen/Qwen3-4B
backend: vllm
n_generations_per_document: 1
limit_documents: 20

max_tokens: 4096
do_sample: true
temperature: 0.8
top_p: 0.95
disable_thinking: true
seed: 42
progress_every: 5
repair_missing_entity_mentions: true
retry_failed_generations: true
max_parse_retries: 4
retry_source_preview_chars: 1500
retry_max_tokens: 1024
retry_temperature: 0.2
retry_top_p: 0.8
allow_plain_text_fallback: true
plain_text_fallback_min_chars: 80
max_full_relations_in_prompt: 120

tensor_parallel_size: 1
dtype: auto
gpu_memory_utilization: 0.9
max_model_len: 32768
trust_remote_code: true

generation_steering:
  enabled: true
  backend: easysteer
  vector_file: outputs/generation/easysteer_vectors/qwen4b_initial_length_restricted/qwen_generation_steering_vectors.npz
  vector_summary_file: outputs/generation/easysteer_vectors/qwen4b_initial_length_restricted/qwen_generation_steering_vector_summary.json
  scale: 1.0
  normalize: true
  phases:
    - generation
  target_layers:
  enforce_eager: true
  enable_chunked_prefill: false

allowed_labels:
  - No_Relation
  - Association
  - Bind
  - Comparison
  - Conversion
  - Cotreatment
  - Drug_Interaction
  - Negative_Correlation
  - Positive_Correlation

allowed_entity_types:
  - GeneOrGeneProduct
  - DiseaseOrPhenotypicFeature
  - ChemicalEntity
