prompt_file: outputs/generation/prompts/baseline_prompt.txt
prompt_json_file: outputs/generation/prompts/baseline_prompt.json
output_dir: outputs/generation/synthetic

model_name: Qwen/Qwen3-4B
requested_number_of_abstracts: 3

temperature: 0.7
top_p: 0.9
max_tokens: 4096
seed: 42

tensor_parallel_size: 1
dtype: auto
gpu_memory_utilization: 0.9
trust_remote_code: true

allowed_labels:
  - No_Relation
  - Association
  - Bind
  - Comparison
  - Conversion
  - Cotreatment
  - Drug_Interaction
  - Negative_Correlation
  - Positive_Correlation

allowed_entity_types:
  - GeneOrGeneProduct
  - DiseaseOrPhenotypicFeature
  - ChemicalEntity
